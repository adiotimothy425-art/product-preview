<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Product preview card component</title>
  </head>
  <body class="md:w-[1440px] w-[480px] bg-[var(--Cream)]">
    <div
      class="md:w-[600px] mx-auto flex flex-col my-[100px] w-[350px] md:flex-row items-center"
    >
      <img
        src="./images/image-product-desktop.jpg"
        alt=""
        class="w-1/2 h-[450px] hidden md:block rounded-1-[10px]"
      />
      <img
        src="./images/image-product-mobile.jpg"
        alt=""
        class="w-full block md:hidden rounded-t-[10px]"
      />
      <!-- PERFUME info -->
      <div
        class="md:w-1/2 w-full h-[450px] bg-white p-7.5 flex flex-col justify-between text-sm md:rounded-r-[10px] rounded-b-[10px]"
      >
        <p class="text-[var(--Grey)] font-medium tracking-[4px]">PERFUME</p>
        <h1 class="fam text-[30px] font-bold leading-none">
          Gabrielle Essence Eau <br />
          De Parfum
        </h1>
        <p class="text-[var(--Grey)] font-medium">
          A floral, solar and voluptuous interpretation composed by Oliver
          Polge, Perfumer-Creator for the House of CHANEL
        </p>
        <!-- PRICE -->
        <div class="flex gap-5 items-center">
          <p class="fam text-3xl font-bold text-[#3C8067]">$149.99</p>
          <p class="line-through text-[#6C7289] font-medium">$169.99</p>
        </div>
        <!--;] ADD TO CART BUTTON -->
        <div
          class="flex items-center bg-[#3C8067] text-white p-4 gap-3 rounded-[10px] font-bold justify-center font-bold hover:bg-[var(--Green-700)] cursor-pointer"
        >
          <img src="./images/icon-cart.svg" alt="" />
          <p>Add to Cart</p>
        </div>
      </div>
    </div>
  </body>
</html>
